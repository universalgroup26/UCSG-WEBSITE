# Cloudflare Pages Configuration
# Deploy with: npx wrangler pages deploy .vercel/output/static
# Or connect your GitHub repo at dash.cloudflare.com/pages

name = "ucsg-website"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NEXT_PUBLIC_SITE_URL = "https://universalconsultingservices.com"

# Cloudflare Pages static assets
[site]
bucket = ".vercel/output/static"

# Turnstile settings (set your site key and secret in Cloudflare dashboard)
# NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAA..."
# TURNSTILE_SECRET_KEY = "0x4AAAAAAA..."

# Web Analytics (replace with your Cloudflare Web Analytics token)
# NEXT_PUBLIC_CF_ANALYTICS_TOKEN = "your_token_here"
